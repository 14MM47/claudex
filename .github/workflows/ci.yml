name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck \
            scripts/codex_bridge.sh \
            hooks/codex-trigger.sh \
            install.sh \
            tests/test_codex_trigger.sh

  hook-trigger-test:
    name: Hook trigger regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run trigger tests
        run: tests/test_codex_trigger.sh
